<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Rufluvia Tuneのご案内とプライバシーポリシー。">
    <title>Rufluvia Tune</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f7f8f3; color: #20313d; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; line-height: 1.8; }
      .skip-link { position: absolute; left: -9999px; top: 0; padding: .6rem 1rem; background: #fff; color: #174f73; }
      .skip-link:focus { left: 1rem; z-index: 2; }
      header { background: #e8f2ed; border-bottom: 1px solid #c9ddd5; padding: 2.5rem 1.25rem; }
      .wrap { width: min(100%, 760px); margin-inline: auto; }
      .brand { margin: 0; color: #315f82; font-weight: 700; letter-spacing: .05em; }
      h1 { margin: .4rem 0 0; font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.35; }
      main { padding: 2rem 1.25rem 3rem; }
      .panel { background: #fff; border: 1px solid #dce6df; border-radius: 18px; padding: 1.5rem; }
      .panel h2 { margin: 0 0 .5rem; color: #244a68; font-size: 1.2rem; }
      .panel p { margin: 0 0 1rem; }
      a { color: #174f73; text-decoration-thickness: .1em; text-underline-offset: .15em; }
      a:focus-visible { outline: 3px solid #1768d4; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header>
      <div class="wrap">
        <p class="brand">Rufluvia / ルフルヴィア</p>
        <h1>Rufluvia Tune</h1>
      </div>
    </header>
    <main id="main" class="wrap">
      <section class="panel" aria-labelledby="privacy-heading">
        <h2 id="privacy-heading">プライバシーポリシー</h2>
        <p>Rufluvia Tuneにおける情報の扱いをご案内します。</p>
        <a href="./privacy/">プライバシーポリシーを読む</a>
      </section>
    </main>
  </body>
</html>
